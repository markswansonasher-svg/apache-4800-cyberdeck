# Cyberdeck: answer DNS for the case network (PC + laptop) in travel mode.
# DNS only - no DHCP (every device on the case network has a fixed IP).
# Upstream = whatever DNS the Pi's Wi-Fi gave it (from /etc/resolv.conf), so
# hotel / school login pages keep working.
listen-address=10.48.0.2
bind-dynamic
no-dhcp-interface=eth0
domain-needed
bogus-priv
cache-size=1000
